<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FixMyCampus — Campus Problem Reporting & Facilities Management{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation -->
  <header class="site-header">
    <div class="container navbar">
      <!-- Brand Logo -->
      <a href="/" class="brand">
        <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 3l9 7H3l9-7z"/>
        </svg>
        <span class="brand-logo-text">FixMyCampus</span>
      </a>

      <!-- Navigation Action -->
      <nav class="nav-links">
        {% if request.url.path.startswith('/admin') %}
        <a href="/" class="nav-link-btn">
          &larr; Student Portal
        </a>
        {% else %}
        <a href="/admin" class="nav-link-btn">
          Facilities Admin &rarr;
        </a>
        {% endif %}
      </nav>
    </div>
  </header>

  <!-- Flash Notification Banner -->
  {% if flash_message %}
  <div class="container flash-container">
    <div class="flash-alert">
      <span>{{ flash_message }}</span>
      <a href="{{ request.url.path }}" class="flash-dismiss">&times;</a>
    </div>
  </div>
  {% endif %}

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Minimal Editorial Footer -->
  <footer class="site-footer">
    <div class="container footer-simple">
      <div class="footer-copy">
        <strong>FixMyCampus</strong> &mdash; Campus Maintenance & Operations System
      </div>
      <div class="footer-links">
        <a href="/">Student Portal</a>
        <span class="dot-sep">&bull;</span>
        <a href="/admin">Facilities Admin</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/static/js/app.js"></script>
</body>
</html>
